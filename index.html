    <title>ZKas Wallet</title>
    <!-- Installable PWA: on iPhone this is THE app channel (Safari → Share →
         Add to Home Screen gives a full-screen, home-icon wallet; Apple allows
         no APK-style installs). Android Chrome offers its install prompt too. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ZKas" />
  </head>
  <body>
    <!-- Inline boot splash. Everything it needs — the styles AND the ZKas coin
         mark, inlined as a data URI — arrives in this one HTML response, so the
         browser paints the finished brand on its very first frame: no stylesheet
         to wait for, no second request for the logo, no JavaScript parsed yet.
         A mark that is complete the instant it appears is the whole point; the
         earlier splash drew a shield outline over two seconds, so for most of
         the wait the screen showed a teal fragment rather than a logo.
         It is a sibling of #root, not its content: React mounts into an empty
         #root underneath and main.tsx then cross-fades this layer away, so the
         app is already painted before the splash goes (no flash, no jump, and
         no second copy of the splash rendered by React). The boot guards below
         and in main.tsx still find it by .boot and write their message into it. -->
    <style>
      html, body { background: #08080c; margin: 0; }
      .boot {
        position: fixed; inset: 0; z-index: 2147483000;
        display: flex; align-items: center; justify-content: center;
        /* Plain gradients, not blurred circles: a 60px blur filter is real work
           for the compositor on exactly the weak phones this screen exists for,
           and it would be paid before the first paint. This looks the same. */
        background:
          radial-gradient(62% 46% at 16% 10%, rgba(23, 214, 190, 0.11), transparent 70%),
          radial-gradient(58% 42% at 86% 90%, rgba(62, 230, 209, 0.08), transparent 70%),
          #08080c;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        opacity: 1;
        transition: opacity 240ms ease;
      }
      /* Added by main.tsx once React has painted; the element is removed after. */
      .boot-done { opacity: 0; pointer-events: none; }
      .boot-stack {
        display: flex; flex-direction: column; align-items: center; gap: 22px;
        transform: translateY(-4%);
      }
      .boot-logo { position: relative; width: 88px; height: 88px; }
      /* A slow halo under the mark. Opacity + transform only, so it runs on the
         compositor and never repaints the logo. */
      .boot-logo::before {
        content: ""; position: absolute; inset: -30%; border-radius: 50%;
        background: radial-gradient(circle, rgba(23, 214, 190, 0.3), rgba(23, 214, 190, 0) 68%);
        animation: boot-halo 2.8s ease-in-out infinite;
      }
      .boot-logo img { position: relative; display: block; width: 88px; height: 88px; }
      @keyframes boot-halo {
        0%, 100% { opacity: 0.5; transform: scale(0.92); }
        50% { opacity: 1; transform: scale(1.06); }
      }
      .boot-tag {
        font-size: 11px; font-weight: 600; letter-spacing: 0.22em;
        text-transform: uppercase; color: #6c6e7e;
      }
      .boot-bar {
        width: 132px; height: 2px; border-radius: 2px;
        background: rgba(255, 255, 255, 0.07); overflow: hidden;
      }
      .boot-bar span {
        display: block; width: 40%; height: 100%; border-radius: 2px;
        background: linear-gradient(90deg, rgba(23, 214, 190, 0), #17d6be, rgba(23, 214, 190, 0));
        animation: boot-slide 1.5s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes boot-slide {
        from { transform: translateX(-110%); }
        to { transform: translateX(360%); }
      }
      /* A little more presence on a laptop window; the mark is a 176px source,
         so this stays sharp on a 2x display. */
      @media (min-width: 720px) {
        .boot-logo, .boot-logo img { width: 96px; height: 96px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot { transition: none; }
        .boot-logo::before { animation: none; opacity: 0.8; }
        .boot-bar span { animation: none; width: 100%; opacity: 0.3; }
      }
    </style>

    <div id="root"></div>
    <!-- Old-engine guard, deliberately ES5. The app bundle is a modern module
         (es2020 syntax, WebAssembly, BigInt): on an outdated Android System
         WebView or ancient browser it fails to PARSE, the splash never gets
         replaced, and the user sees a loading screen forever — a "white
         screen" bug report. This classic script parses everywhere, probes the
         exact features the wallet needs, and says what to do instead. -->
    <script>
      (function () {
        var ok = false;
        try {
          // No eval-based syntax probe here: it needs CSP 'unsafe-eval', which we
          // do NOT grant (a wallet holding a seed in localStorage must keep the
          // script surface minimal). Any engine with BigInt + WebAssembly +
          // crypto.getRandomValues already supports the es2020 syntax the bundle
          // uses, so these capability checks are a sufficient gate on their own.
          ok =
            typeof BigInt === "function" &&
            typeof WebAssembly === "object" &&
            typeof Promise !== "undefined" &&
            typeof crypto !== "undefined" &&
            typeof crypto.getRandomValues === "function";
        } catch (e) {
          ok = false;
        }
        if (!ok) {
          var el = document.querySelector(".boot");
          if (el) {
            el.innerHTML =
              '<div style="max-width:420px;padding:24px;text-align:center;color:#f6f6f8;">' +
              '<div style="font-size:24px;font-weight:700;margin-bottom:12px;"><span style="color:#17d6be;">Z</span>Kas</div>' +
              '<p style="color:#b9b9c6;line-height:1.5;">This device’s web engine is too old to run the wallet’s cryptography.</p>' +
              '<p style="color:#b9b9c6;line-height:1.5;">On Android, update <b>Android System WebView</b> (and Chrome) in the Play Store, then reopen the app. In a browser, please update it or try another one.</p>' +
              "</div>";
          }
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
