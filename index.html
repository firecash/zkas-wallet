<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08080c" />
    <title>ZKas Wallet</title>
    <!-- Installable PWA: on iPhone this is THE app channel (Safari → Share →
         Add to Home Screen gives a full-screen, home-icon wallet; Apple allows
         no APK-style installs). Android Chrome offers its install prompt too. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ZKas" />
  </head>
  <body>
    <!-- Inline boot splash: painted by the browser the instant the HTML loads,
         before any JS is parsed, so opening the app is never a blank screen. A
         shield drawing its own outline and ticking a checkmark, over the wordmark
         and the wallet's promise — the same identity the React app opens into, so
         the hand-off is seamless. React replaces the whole #root content on mount. -->
    <style>
      html, body { background: #08080c; margin: 0; }
      .boot {
        position: relative; overflow: hidden;
        min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        font-family: system-ui, -apple-system, sans-serif;
      }
      /* A soft teal aurora, matching the app's background glow. */
      .boot::before, .boot::after {
        content: ""; position: absolute; border-radius: 50%;
        filter: blur(60px); pointer-events: none;
        animation: bootglow 6s ease-in-out infinite alternate;
      }
      .boot::before { width: 340px; height: 340px; top: 12%; left: 8%;
        background: rgba(23,214,190,0.16); }
      .boot::after { width: 300px; height: 300px; bottom: 10%; right: 6%;
        background: rgba(62,230,209,0.10); animation-delay: -3s; }
      @keyframes bootglow {
        from { transform: translateY(-8px) scale(1); opacity: 0.8; }
        to   { transform: translateY(10px) scale(1.1); opacity: 1; }
      }
      .boot-shield { position: relative; z-index: 1; filter: drop-shadow(0 0 16px rgba(23,214,190,0.25)); }
      .boot-shield path { stroke: #17d6be; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .boot-outline { stroke-width: 2.5; stroke-dasharray: 150; stroke-dashoffset: 150;
        animation: bootdraw 2s ease infinite; }
      .boot-check { stroke-width: 2.5; stroke-dasharray: 34; stroke-dashoffset: 34;
        animation: bootcheck 2s ease infinite; }
      @keyframes bootdraw {
        0% { stroke-dashoffset: 150; } 45% { stroke-dashoffset: 0; }
        85% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0.5; }
      }
      @keyframes bootcheck {
        0%, 40% { stroke-dashoffset: 34; } 70%, 100% { stroke-dashoffset: 0; }
      }
      .boot-mark { position: relative; z-index: 1;
        font-size: 30px; font-weight: 700; color: #f6f6f8; letter-spacing: -0.02em; }
      .boot-mark span { color: #17d6be; }
      .boot-tag { position: relative; z-index: 1;
        font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
        color: #7a7a8c; }
      @media (prefers-reduced-motion: reduce) {
        .boot::before, .boot::after, .boot-outline, .boot-check { animation: none; }
        .boot-outline, .boot-check { stroke-dashoffset: 0; }
      }
    </style>
    <div id="root">
      <div class="boot">
        <svg class="boot-shield" viewBox="0 0 48 56" width="60" height="70" aria-hidden="true">
          <path class="boot-outline" d="M24 3 L44 11 V27 C44 41 35 51 24 55 C13 51 4 41 4 27 V11 Z" />
          <path class="boot-check" d="M16 28 L22 35 L33 21" />
        </svg>
        <div class="boot-mark"><span>Z</span>Kas</div>
        <div class="boot-tag">Private · Fast</div>
      </div>
    </div>
    <!-- Old-engine guard, deliberately ES5. The app bundle is a modern module
         (es2020 syntax, WebAssembly, BigInt): on an outdated Android System
         WebView or ancient browser it fails to PARSE, the splash never gets
         replaced, and the user sees an animated shield forever — a "white
         screen" bug report. This classic script parses everywhere, probes the
         exact features the wallet needs, and says what to do instead. -->
    <script>
      (function () {
        var ok = false;
        try {
          // No eval-based syntax probe here: it needs CSP 'unsafe-eval', which we
          // do NOT grant (a wallet holding a seed in localStorage must keep the
          // script surface minimal). Any engine with BigInt + WebAssembly +
          // crypto.getRandomValues already supports the es2020 syntax the bundle
          // uses, so these capability checks are a sufficient gate on their own.
          ok =
            typeof BigInt === "function" &&
            typeof WebAssembly === "object" &&
            typeof Promise !== "undefined" &&
            typeof crypto !== "undefined" &&
            typeof crypto.getRandomValues === "function";
        } catch (e) {
          ok = false;
        }
        if (!ok) {
          var el = document.querySelector(".boot");
          if (el) {
            el.innerHTML =
              '<div style="max-width:420px;padding:24px;text-align:center;color:#f6f6f8;">' +
              '<div style="font-size:24px;font-weight:700;margin-bottom:12px;"><span style="color:#17d6be;">Z</span>Kas</div>' +
              '<p style="color:#b9b9c6;line-height:1.5;">This device’s web engine is too old to run the wallet’s cryptography.</p>' +
              '<p style="color:#b9b9c6;line-height:1.5;">On Android, update <b>Android System WebView</b> (and Chrome) in the Play Store, then reopen the app. In a browser, please update it or try another one.</p>' +
              "</div>";
          }
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
