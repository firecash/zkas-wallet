# wallet.zkas.info (VPS2): same-origin chain data for "Run in this browser", served fast.
#
# Measured 1 Nov: through the old proxy a request took ~1.4 s (a new TLS connection to
# zkas.info per request across a 221 ms VPS2<->VPS1 link) and an 8.2 MB segment 3.8 s
# instead of 0.25 s direct. Segments are immutable (their file names carry their hash), so
# VPS2 caches them; the manifest and the gateway are proxied over kept-alive connections.
#
# 1) http context (e.g. /etc/nginx/conf.d/zkas-chain-cache.conf):
proxy_cache_path /var/cache/nginx/zkas-chain levels=1:2 keys_zone=zkas_chain:10m max_size=6g inactive=30d use_temp_path=off;
upstream zkas_info_tls {
    server 185.147.157.125:443;
    keepalive 16;
}

