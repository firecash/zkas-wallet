# Canonical production security headers for the hosted web wallet (wallet.zkas.info).
#
# This file is the version-controlled SOURCE OF TRUTH for the mitigation the README
# calls "a strict Content-Security-Policy". It is enforced in production by nginx on the
# web host, included from the wallet.zkas.info server block as:
#
#     include snippets/wallet-sec.conf;
#
# Committed here (per security review OB-ZKW-04) so the policy can be reviewed, diffed and
# regression-checked in this repo, not only on the server. When you change the CSP, change
# it HERE first, then deploy the same bytes to the host.
#
# The seed lives in the browser's localStorage, so the CSP is the real defense: it blocks
# any injected script from running or exfiltrating the seed to another host.
#
# NOTE on the script-src hash: 'sha256-…' pins the one inline bootstrap in index.html. If
# that inline script changes, the hash must be regenerated or the page will not boot.

add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval' 'sha256-TYP0f2KHUhD2pf53wJOxQ9Rttl6i71AIMbSqSofx/60='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://services.zkas.info http://127.0.0.1:* http://localhost:*; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src https://explorer.zkas.info; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Strict-Transport-Security "max-age=63072000" always;
