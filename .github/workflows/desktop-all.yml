# Desktop wallet for every platform we can honestly support, in one run.
#
# Tauri cannot cross-compile a bundle: the installer format is produced by the
# host OS (WiX/NSIS on Windows, dpkg/AppImage on Linux, hdiutil on macOS), so
# each target needs its own runner. That is the whole reason this is a matrix and
# not a loop.
#
# Everything lands on a release tag chosen at dispatch time, so desktop builds
# can ride along with the mobile release rather than living in a separate place.

name: desktop-all
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the builds to"
        required: true
        default: "v0.3.1"
      platforms:
        description: "Comma-separated targets, or 'all' (windows-x86_64, linux-x86_64, linux-aarch64, macos-x86_64, macos-aarch64)"
        required: false
        default: "all"
  push:
    # Fire on the single release tag so desktop assets land on the SAME release
    # as the mobile/web build (v0.3.11 etc.), not a separate desktop-v* release.
    tags: ["v*"]

jobs:
  # Pick the matrix before spawning runners, so a request for one platform does not queue
  # five. A job-level `if` cannot see the `matrix` context, so the selection has to happen
  # here and be handed over as JSON.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        run: |
          ALL='[
            {"os":"windows-latest","name":"windows-x86_64","target":"x86_64-pc-windows-msvc","bundles":"msi,nsis"},
            {"os":"ubuntu-22.04","name":"linux-x86_64","target":"x86_64-unknown-linux-gnu","bundles":"deb,appimage"},
            {"os":"ubuntu-22.04-arm","name":"linux-aarch64","target":"aarch64-unknown-linux-gnu","bundles":"deb,appimage"},
            {"os":"macos-14","name":"macos-x86_64","target":"x86_64-apple-darwin","bundles":"app,dmg"},
            {"os":"macos-14","name":"macos-aarch64","target":"aarch64-apple-darwin","bundles":"app,dmg"}
          ]'
          WANT='${{ github.event.inputs.platforms }}'
          # A tag push has no inputs, and must keep building everything.
          if [ -z "$WANT" ] || [ "$WANT" = "all" ]; then
            echo "matrix=$(echo "$ALL" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"
          else
            SEL=$(echo "$ALL" | jq -c --arg w "$WANT" '[ .[] | select( ($w | split(",") | map(gsub("^ +| +$";"")) ) as $n | .name as $x | $n | index($x) ) ]')
            COUNT=$(echo "$SEL" | jq 'length')
            if [ "$COUNT" -eq 0 ]; then
              echo "No target matched '$WANT'. Valid: windows-x86_64 linux-x86_64 linux-aarch64 macos-x86_64 macos-aarch64" >&2
              exit 1
            fi
            echo "Building $COUNT target(s): $(echo "$SEL" | jq -r '[.[].name] | join(", ")')"
            echo "matrix=$(echo "$SEL" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: setup
    permissions:
      contents: write
    strategy:
      # One platform failing must not deny the others a release — a missing
      # Windows build is bad, but withholding the Linux one too is worse.
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      # The Tauri crate depends on ../../rusty-kaspa/zkas-walletd relative to
      # src-tauri, so the two repos must sit side by side.
      - uses: actions/checkout@v4
        with:
          path: wallet
      - uses: actions/checkout@v4
        with:
          repository: firecash/zkas-rusty
          path: rusty-kaspa

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # protoc: the kaspa gRPC crates generate their client at build time.
      - name: protoc (linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: protoc (macos)
        if: startsWith(matrix.os, 'macos')
        run: brew install protobuf
      - name: protoc (windows)
        if: startsWith(matrix.os, 'windows')
        run: choco install protoc -y

      # Tauri's Linux bundler needs the webkit/gtk stack and patchelf.
      - name: Tauri system deps (linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libssl-dev libxdo-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wallet/src-tauri
          key: ${{ matrix.name }}

      - name: Web bundle deps
        working-directory: wallet
        run: npm ci

      - name: Build
        working-directory: wallet
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # Ad-hoc signing so Gatekeeper lets the user through with right-click →
      # Open. Real notarization needs an Apple Developer account.
      - name: Sign and zip (macos)
        if: startsWith(matrix.os, 'macos')
        working-directory: wallet/src-tauri/target/${{ matrix.target }}/release/bundle/macos
        run: |
          codesign --force --deep -s - "ZKas Wallet.app"
          codesign --verify --verbose "ZKas Wallet.app"
          ditto -c -k --keepParent "ZKas Wallet.app" "ZKas-Wallet-${{ matrix.name }}.zip"

      - name: Collect artifacts
        shell: bash
        working-directory: wallet
        run: |
          mkdir -p out
          B="src-tauri/target/${{ matrix.target }}/release/bundle"
          # Name every file after its platform+arch. Tauri's own names collide
          # across targets ("ZKas Wallet_0.1.0_amd64.deb" from two runners), and a
          # user cannot tell which build they downloaded from the filename alone.
          find "$B" -type f \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.msi' -o -name '*.exe' -o -name '*.zip' \) -print0 |
          while IFS= read -r -d '' f; do
            base=$(basename "$f")
            ext="${base##*.}"
            cp "$f" "out/ZKas-Wallet-${{ matrix.name }}.${ext}"
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: zkas-wallet-${{ matrix.name }}
          path: wallet/out/*

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: wallet
        run: |
          TAG="${{ github.event.inputs.tag }}"
          [ -n "$TAG" ] || TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "${GITHUB_REPOSITORY}" --title "$TAG" --notes "Desktop builds."
          gh release upload "$TAG" out/* --repo "${GITHUB_REPOSITORY}" --clobber
