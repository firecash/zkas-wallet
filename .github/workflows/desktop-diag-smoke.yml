# Desktop diagnostics smoke test, on demand only (workflow_dispatch). Builds the desktop app
# on Windows and macOS the way desktop-all.yml does (same runners, targets, engine pin), then
# LAUNCHES it with the scripted diagnostics tour (ZKAS_DIAG_TOUR=1) and a throwaway watch-only
# wallet (fresh random seed, kept on the runner), lets it write its diag files and exports,
# and checks every line against the redactor with scripts/diag-check.mjs — on the runner's
# own OS, Windows included. Run 1 ends with a hard kill, run 2 must report prev_unclean and
# is closed through the window (WM_CLOSE on Windows).
#
# It publishes NOTHING: read-only token, no release or tag step; the only output is this
# run's own 1-day artifacts (redacted diag files, exports, the DLL list).
#
#   gh workflow run desktop-diag-smoke.yml --ref main
name: desktop-diag-smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x86_64, target: x86_64-pc-windows-msvc, bundles: "nsis" }
          - { os: macos-14, name: macos-aarch64, target: aarch64-apple-darwin, bundles: "app" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: wallet
      - uses: actions/checkout@v4
        with:
          repository: firecash/zkas-rusty
          ref: 0fb6f65f78264cd892156e607805100ae8f53984
          path: rusty-kaspa
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: protoc (macos)
        if: startsWith(matrix.os, 'macos')
        run: brew install protobuf
      - name: protoc (windows)
        if: startsWith(matrix.os, 'windows')
        uses: arduino/setup-protoc@v3
        with:
          version: "27.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wallet/src-tauri
          key: ${{ matrix.name }}
      - name: Web bundle deps
        working-directory: wallet
        run: npm ci
      - name: Build
        working-directory: wallet
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      # After the build: tauri::generate_context! needs ../dist to exist.
      - name: Rust diag tests (release profile, this OS)
        working-directory: wallet
        shell: bash
        run: cargo test --release --target ${{ matrix.target }} --manifest-path src-tauri/Cargo.toml --lib "diag::" 2>&1 | grep -E "^test |test result|error" ; exit ${PIPESTATUS[0]}

      - name: DLL gate (windows)
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          $exe = "wallet/src-tauri/target/${{ matrix.target }}/release/zkas-desktop.exe"
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem -Recurse "$vs\VC\Tools\MSVC" -Filter dumpbin.exe | Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          New-Item -ItemType Directory -Force out | Out-Null
          $deps = & $dumpbin.FullName /dependents $exe | Select-String '\.dll' | ForEach-Object { $_.ToString().Trim() }
          $deps | Tee-Object -FilePath out/dlls.txt
          if ($deps -match 'libstdc|libgcc|winpthread') { Write-Error "MinGW runtime DLL dependency"; exit 1 }
          Copy-Item $exe out/zkas-desktop.exe

      - name: Run 1 (tour + throwaway wallet, then hard kill) and run 2 (prev_unclean, then close)
        working-directory: wallet
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN="$PWD/src-tauri/target/${{ matrix.target }}/release/zkas-desktop.exe"
          else
            APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/ZKas Wallet.app"
            codesign --force --deep -s - "$APP"
            BIN="$PWD/$APP/Contents/MacOS/zkas-desktop"
          fi
          SECRETS="$RUNNER_TEMP/secrets.txt"; : > "$SECRETS"
          npx vite-node ci/diag-run.mjs "$BIN" 420 run1 ../out kill register "$SECRETS"
          sleep 5
          npx vite-node ci/diag-run.mjs "$BIN" 150 run2 ../out close
      - name: Collect diag files and exports
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then D="$(cygpath -u "$APPDATA")/info.zkas.wallet"; DL="$(cygpath -u "$USERPROFILE")/Downloads"; else D="$HOME/Library/Application Support/info.zkas.wallet"; DL="$HOME/Downloads"; fi
          mkdir -p out/diag-files out/exports
          cp "$D"/logs/diag/*.jsonl out/diag-files/ 2>/dev/null || true
          cp "$DL"/zkas-diagnostics-*.jsonl out/exports/ 2>/dev/null || true
          ls -la "$D" "$D/logs" "$D/logs/diag" > out/datadir.txt 2>&1 || true
          cat out/datadir.txt
          ls -la out/diag-files out/exports
          echo "crash.log lines: $(wc -l < "$D/crash.log" 2>/dev/null)"
      - name: Check every export and diag file against the redactor
        working-directory: wallet
        shell: bash
        run: |
          shopt -s nullglob
          n=0; rc=0
          for f in ../out/exports/*.jsonl ../out/diag-files/*.jsonl; do
            n=$((n+1)); echo "== $f"
            npx vite-node scripts/diag-check.mjs "$f" --secrets "$RUNNER_TEMP/secrets.txt" > "$f.check.txt" 2>&1 || rc=1
            tail -30 "$f.check.txt"
          done
          echo "checked $n files"
          [ $n -gt 0 ] || { echo "no diag output at all"; exit 1; }
          exit $rc
      - name: Event census (what the run recorded)
        if: always()
        shell: bash
        run: |
          cat out/diag-files/*.jsonl 2>/dev/null | node -e '
            const lines=require("fs").readFileSync(0,"utf8").split("\n").filter(Boolean);
            const c=new Map(); let bad=0;
            for (const l of lines) { try { const o=JSON.parse(l); const k=`${o.src}:${o.cat}.${o.ev}`; c.set(k,(c.get(k)||0)+1);} catch { bad++; } }
            console.log(`lines ${lines.length}, unparsable ${bad}`);
            for (const [k,v] of [...c].sort()) console.log(String(v).padStart(6), k);
          ' | tee out/census.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-diag-smoke-${{ matrix.name }}
          path: out/
          retention-days: 1
