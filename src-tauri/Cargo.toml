[package]
name = "zkas-desktop"
version = "1.0.1"
description = "ZKas desktop wallet — the shielded wallet engine embedded in a native shell"
edition = "2021"
license = "ISC"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "process", "io-util", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
sysinfo = { version = "0.31.2", default-features = false, features = ["system"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
# The wallet daemon as a library: REST API + sync loops + Orchard engine.
# Path dep: rusty-kaspa checked out as a sibling of this repo.
zkas-walletd = { path = "../../rusty-kaspa/zkas-walletd" }
kaspa-core = { path = "../../rusty-kaspa/core" }
kaspa-addresses = { path = "../../rusty-kaspa/crypto/addresses" }
kaspa-grpc-client = { path = "../../rusty-kaspa/rpc/grpc/client" }
kaspa-rpc-core = { path = "../../rusty-kaspa/rpc/core" }
kaspa-consensus-core = { path = "../../rusty-kaspa/consensus/core" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
serde_yaml = "0.9"

# Mirrors the rusty-kaspa workspace release profile EXACTLY. Not cosmetic: the
# workspace enables overflow-checks in release but opts the constant-time crypto
# crates out (they rely on wrapping ops — with checks on, proving panics), and a
# matching profile also lets this build reuse the workspace's release artifacts.
[profile.release]
lto = "thin"
strip = true
overflow-checks = true

[profile.release.package.halo2_proofs]
opt-level = 3
codegen-units = 1
overflow-checks = false

[profile.release.package.halo2_gadgets]
opt-level = 3
codegen-units = 1
overflow-checks = false

[profile.release.package.pasta_curves]
opt-level = 3
codegen-units = 1
overflow-checks = false
